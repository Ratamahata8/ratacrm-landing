# EXAMPLE ONLY — review and merge; do not overwrite an existing configuration.
server {
  listen 80;
  server_name neurovideo.ratacrm.ru;
  root /var/www/neurovideo/dist;
  index index.html;
  location / { try_files $uri $uri/ $uri.html =404; }
  location ~* \.(?:css|js|webp|avif|svg|mp4)$ { expires 30d; add_header Cache-Control "public, immutable"; }
  # Add TLS directives using your established certificate-management process.
}

